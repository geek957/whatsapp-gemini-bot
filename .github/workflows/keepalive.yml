name: keepalive

# GitHub disables scheduled workflows on a repository with no commit activity for 60 days,
# which would silently stop the bot. One commit a week keeps the schedule enabled.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --quiet --cached && { echo "nothing changed"; exit 0; }
          git commit -m "chore: keep scheduled workflows enabled"
          git push
